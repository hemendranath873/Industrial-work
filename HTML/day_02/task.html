<!doctype html>
<head>
  <title>Build page structure</title>
  <link rel="stylesheet" href="design.css">
</head>
<body>

  <header class="site-header">
    <div class="logo-wrap">
      <img src="https://appstick.com.bd/_next/image?url=%2Fappstick-logo.webp&w=128&q=75" alt="Appstick logo">
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <div class="nav-item">
        <p class="first-paragraph"><span class="nav-heading">Products</span></p>
        <button class="nav-toggle" aria-expanded="false">▾</button>
      </div>

      <div class="nav-item">
        <p class="first-paragraph"><span class="nav-heading">Services</span></p>
        <button class="nav-toggle" aria-expanded="false">▾</button>
      </div>

      <div class="nav-item"><p><span class="nav-heading">Case studies</span></p></div>
      <div class="nav-item"><p><span class="nav-heading">Teams</span></p></div>
      <div class="nav-item"><p><span class="nav-heading">About us</span></p></div>
      <div class="nav-item"><p><span class="nav-heading">Career</span></p></div>

      <div class="contact-wrap">
        <button class="contact-btn">Contact Us</button>
      </div>
    </nav>
  </header>

  <main class="page-main">
    <section class="maintenance">
      <div class="maintenance-header">
        <h1>Maintenance Service</h1>
        <h3 class="subtitle">You must purchase a license first from our website to buy our maintenance services.</h3>
      </div>

      <div class="carousel-controls">
        <button class="arrow left">‹</button>

        <div class="carousel">
          <figure class="card">
            <img src="https://picsum.photos/seed/pets/600/380" alt="Petstick project screenshot">
            <figcaption>Petstick</figcaption>
          </figure>

          <figure class="card">
            <img src="https://picsum.photos/seed/tax/600/380" alt="Taxstick project screenshot">
            <figcaption>Taxstick</figcaption>
          </figure>

          <figure class="card featured">
            <img src="https://picsum.photos/seed/ecostick/600/380" alt="Ecostick project screenshot">
            <figcaption>Ecostick - Solar Products &amp;...</figcaption>
          </figure>

          <figure class="card">
            <img src="https://picsum.photos/seed/travel/600/380" alt="Travelstick project screenshot">
            <figcaption>Travelstick – Smart &amp; Scalable Travel...</figcaption>
          </figure>

          <figure class="card">
            <img src="https://picsum.photos/seed/gostick/600/380" alt="Gostick project screenshot">
            <figcaption>Gostick – A Complete Car Rental Platform</figcaption>
          </figure>
        </div>

        <button class="arrow right">›</button>
      </div>
    </section>
  </main>

</body>
</html>
